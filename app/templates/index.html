{% extends "base.html" %}

{% block title %}Pitwall — Lap Comparison{% endblock %}

{% block content %}
<div id="controls" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
    <h2 class="text-lg font-semibold mb-4">Lap Time Comparison</h2>
    <p class="text-gray-500 text-sm">Select a race and two drivers to compare lap times.</p>
</div>

<div id="chart-container" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <p class="text-gray-400 text-sm text-center py-12">Chart will appear here once you select a comparison.</p>
</div>
{% endblock %}
