<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pitwall{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { f1red: '#E10600' }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-indicator { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-[#FAFAFA] font-sans text-gray-900 min-h-screen">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between py-4">
                <h1 class="text-xl font-bold tracking-tight">
                    <span class="text-f1red">Pit</span>wall
                </h1>
                <nav class="flex gap-1 sm:gap-2">
                    <a href="/"
                       class="px-3 py-2 text-sm font-medium rounded-md transition-colors
                              {% if nav_active == 'laps' %}text-f1red border-b-2 border-f1red{% else %}text-gray-500 hover:text-gray-900{% endif %}">
                        Lap Comparison
                    </a>
                    <a href="/championship"
                       class="px-3 py-2 text-sm font-medium rounded-md transition-colors
                              {% if nav_active == 'championship' %}text-f1red border-b-2 border-f1red{% else %}text-gray-500 hover:text-gray-900{% endif %}">
                        Championship
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
